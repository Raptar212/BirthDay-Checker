<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- Background of the adaptive icon: the PC icon's red gradient (src/BirthdayChecker.App/Assets/app.ico); the launcher crops the shape. -->
<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#EF5B45" />
            <stop offset="1" stop-color="#C22F3A" />
        </linearGradient>
    </defs>
    <rect x="0" y="0" width="456" height="456" fill="url(#red)" />
</svg>
